<title>System Ascension</title>
<meta name="description" content="Janela de Sistema pessoal: 7 Caminhos, missões, portões, conquistas, títulos, metas e lojas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=VT323&display=swap">
<style>
:root{
  --bg0:#03060d;--bg1:#07101f;--bg2:#0b1830;
  --panel:rgba(8,18,36,.84);--panel2:rgba(13,28,54,.72);--inset:rgba(3,8,18,.6);
  --line:rgba(95,170,255,.2);--line2:rgba(120,190,255,.48);
  --glow:#4fb3ff;--glow-a:rgba(79,179,255,.14);--glow-b:rgba(79,179,255,.34);
  --accent:#4fb3ff;--accent2:#8f6bff;
  --text:#dce9ff;--dim:#8ea3c7;--faint:#5d7398;
  --ok:#3ee6a8;--warn:#f2c14e;--bad:#ff5470;--onaccent:#021022;
  --f-display:'Chakra Petch','Barlow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --grid-op:.05;--r:3px;
  color-scheme:dark;
}
:root[data-skin="sk_violet"]{--bg0:#070313;--bg1:#0e0720;--bg2:#160b30;--panel:rgba(18,9,38,.84);--panel2:rgba(28,14,56,.72);--inset:rgba(9,4,20,.6);--line:rgba(170,130,255,.2);--line2:rgba(190,150,255,.5);--glow:#a98bff;--glow-a:rgba(169,139,255,.15);--glow-b:rgba(169,139,255,.34);--accent:#a98bff;--accent2:#ff5fd2;--text:#ece4ff;--dim:#a99dca;--faint:#716595;--onaccent:#12072a}
:root[data-skin="sk_liminal"]{--bg0:#041315;--bg1:#062024;--bg2:#0a2c31;--panel:rgba(6,30,34,.82);--panel2:rgba(10,44,49,.72);--inset:rgba(2,14,16,.55);--line:rgba(120,230,215,.2);--line2:rgba(150,240,225,.5);--glow:#6fe3d3;--glow-a:rgba(111,227,211,.13);--glow-b:rgba(111,227,211,.32);--accent:#6fe3d3;--accent2:#f3e6c4;--text:#e2f7f3;--dim:#9dc5be;--faint:#67918b;--onaccent:#022521;--grid-op:.09}
:root[data-skin="sk_vhs"]{--bg0:#020703;--bg1:#051007;--bg2:#08180b;--panel:rgba(4,16,7,.86);--panel2:rgba(8,26,11,.74);--inset:rgba(1,8,3,.55);--line:rgba(77,255,136,.2);--line2:rgba(77,255,136,.5);--glow:#4dff88;--glow-a:rgba(77,255,136,.11);--glow-b:rgba(77,255,136,.3);--accent:#4dff88;--accent2:#ff3b3b;--text:#d8ffe3;--dim:#90d0a0;--faint:#5e9069;--onaccent:#021006;--f-display:'VT323','JetBrains Mono',monospace}
:root[data-skin="sk_dream"]{--bg0:#eef2ff;--bg1:#f8f4ff;--bg2:#ffffff;--panel:rgba(255,255,255,.8);--panel2:rgba(255,255,255,.66);--inset:rgba(234,238,255,.75);--line:rgba(116,126,220,.24);--line2:rgba(116,126,220,.55);--glow:#6f7cff;--glow-a:rgba(111,124,255,.12);--glow-b:rgba(111,124,255,.3);--accent:#e8589f;--accent2:#4fb7f0;--text:#252a52;--dim:#565c8c;--faint:#8a8fb6;--ok:#12a473;--warn:#b77d05;--bad:#d9335c;--onaccent:#ffffff;--grid-op:.06;color-scheme:light}
:root[data-skin="sk_cerne"]{--bg0:#08110c;--bg1:#0c1811;--bg2:#122218;--panel:rgba(14,28,19,.86);--panel2:rgba(20,40,27,.74);--inset:rgba(5,12,8,.58);--line:rgba(200,155,91,.2);--line2:rgba(200,155,91,.5);--glow:#c89b5b;--glow-a:rgba(200,155,91,.13);--glow-b:rgba(200,155,91,.3);--accent:#c89b5b;--accent2:#7fc79a;--text:#eaf0e6;--dim:#a9b9a6;--faint:#71846e;--onaccent:#1a1206}
:root[data-skin="sk_rave"]{--bg0:#0b0012;--bg1:#14001f;--bg2:#1d0030;--panel:rgba(22,0,36,.84);--panel2:rgba(34,0,54,.72);--inset:rgba(10,0,18,.58);--line:rgba(255,61,242,.2);--line2:rgba(255,61,242,.55);--glow:#ff3df2;--glow-a:rgba(255,61,242,.14);--glow-b:rgba(255,61,242,.35);--accent:#ff3df2;--accent2:#c6ff00;--text:#ffe8fd;--dim:#d3a3ce;--faint:#906b8c;--onaccent:#1a0018}
:root[data-skin="sk_glitch"]{--bg0:#050505;--bg1:#0b0b0b;--bg2:#141414;--panel:rgba(14,14,14,.88);--panel2:rgba(22,22,22,.74);--inset:rgba(0,0,0,.55);--line:rgba(0,255,240,.2);--line2:rgba(255,0,170,.5);--glow:#00fff0;--glow-a:rgba(0,255,240,.11);--glow-b:rgba(255,0,170,.3);--accent:#ff00aa;--accent2:#00fff0;--text:#f2f2f2;--dim:#a9a9a9;--faint:#6e6e6e;--onaccent:#000}

*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg0);color:var(--text);font:15.5px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(1100px 520px at 78% -8%,var(--glow-a),transparent 62%),radial-gradient(900px 480px at -8% 108%,rgba(143,107,255,.09),transparent 60%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:var(--grid-op);background-image:linear-gradient(var(--glow) 1px,transparent 1px),linear-gradient(90deg,var(--glow) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 25%,#000 25%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 25%,#000 25%,transparent 75%)}
:root[data-skin="sk_vhs"] body::after{opacity:1;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);background-size:auto;-webkit-mask-image:none;mask-image:none}
:root[data-skin="sk_dream"] body::before{background:radial-gradient(620px 300px at 18% 8%,#ffd8ee,transparent 62%),radial-gradient(720px 360px at 86% 18%,#d3eaff,transparent 60%),radial-gradient(820px 420px at 50% 104%,#ece0ff,transparent 60%)}
:root[data-skin="sk_liminal"] body::after{background-size:36px 36px}
a{color:var(--glow)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}.faint{color:var(--faint)}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}

/* ---------- shell ---------- */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:18px 12px 14px;border-right:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),transparent 70%);overflow:auto}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;border:0;background:none;cursor:pointer;text-align:left}
.logo-mark{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line2);color:var(--glow);box-shadow:0 0 18px var(--glow-a),inset 0 0 12px var(--glow-a)}
.logo b{display:block;font:700 15px/1.05 var(--f-display);letter-spacing:.14em;text-transform:uppercase}
.logo small{display:block;font:500 10.5px/1.2 var(--f-mono);letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;color:var(--dim);text-decoration:none;font:600 13px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;border:1px solid transparent;position:relative}
.nav a:hover{color:var(--text);background:var(--glow-a)}
.nav a.on{color:var(--text);border-color:var(--line);background:linear-gradient(90deg,var(--glow-a),transparent)}
.nav a.on::before{content:"";position:absolute;left:-1px;top:6px;bottom:6px;width:2px;background:var(--glow);box-shadow:0 0 10px var(--glow)}
.nav .sep{height:1px;background:var(--line);margin:8px 6px}
.side-foot{margin-top:auto;padding:10px 8px 0;font:500 11px/1.4 var(--f-mono);color:var(--faint)}
.main{min-width:0;display:flex;flex-direction:column}
.hud{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg0) 82%,transparent);backdrop-filter:blur(10px)}
.hud-lv{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.lvbox{display:grid;place-items:center;min-width:52px;height:40px;padding:0 8px;border:1px solid var(--line2);font:700 18px/1 var(--f-display);color:var(--glow);box-shadow:inset 0 0 14px var(--glow-a)}
.lvbox small{display:block;font:600 9px/1 var(--f-mono);color:var(--dim);letter-spacing:.1em}
.hud-xp{flex:1;min-width:120px;max-width:420px}
.hud-xp .row{display:flex;justify-content:space-between;gap:8px;font:500 11px/1.2 var(--f-mono);color:var(--dim)}
.hud-pills{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);background:var(--inset);font:600 12px/1.2 var(--f-mono);white-space:nowrap}
.pill .ic{width:14px;height:14px}
.sync{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--f-mono);color:var(--dim)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync.synced i{background:var(--ok);box-shadow:0 0 8px var(--ok)}.sync.saving i{background:var(--warn);animation:blink 1s infinite}.sync.error i{background:var(--bad)}
@keyframes blink{50%{opacity:.3}}
.view{width:100%;max-width:1200px;margin:0 auto;padding:22px 20px 110px;display:flex;flex-direction:column;gap:18px}
.mnav{display:none}

/* ---------- type ---------- */
h1,h2,h3,h4{margin:0;font-family:var(--f-display);font-weight:700;letter-spacing:.02em;text-wrap:balance;line-height:1.12}
h1{font-size:clamp(26px,3.4vw,36px);text-shadow:0 0 22px var(--glow-a)}
h2{font-size:21px}h3{font-size:17px}h4{font-size:14px;letter-spacing:.06em;text-transform:uppercase}
p{margin:0}
.eyebrow{font:600 11.5px/1.2 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--glow)}
.lead{color:var(--dim);max-width:70ch}
.sys-tag{font-family:var(--f-mono);color:var(--glow);letter-spacing:.06em}

/* ---------- windows ---------- */
.win{position:relative;background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.28);padding:18px;min-width:0}
.win::before,.win::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none;border-color:var(--glow)}
.win::before{top:-1px;left:-1px;border-top:2px solid;border-left:2px solid}
.win::after{bottom:-1px;right:-1px;border-bottom:2px solid;border-right:2px solid}
.win.flat::before,.win.flat::after{display:none}
.win-h{display:flex;align-items:center;gap:10px;margin:-2px 0 14px;font:600 11.5px/1.2 var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--glow)}
.win-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.win-h .ic{width:15px;height:15px}
.win-h .act{order:3;font:600 11px/1 var(--f-mono);letter-spacing:.08em;color:var(--dim);text-decoration:none;background:none;border:0;cursor:pointer}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-status{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.hr{height:1px;background:var(--line);margin:4px 0}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:7px 14px;border:1px solid var(--line2);background:transparent;color:var(--text);font:600 12.5px/1.1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,box-shadow .15s}
.btn:hover{background:var(--glow-a);border-color:var(--glow)}
.btn.primary{background:var(--glow);border-color:var(--glow);color:var(--onaccent);box-shadow:0 0 18px var(--glow-a)}
.btn.primary:hover{box-shadow:0 0 26px var(--glow-b)}
.btn.ghost{border-color:transparent;color:var(--dim)}.btn.ghost:hover{color:var(--text);border-color:var(--line)}
.btn.danger{border-color:color-mix(in srgb,var(--bad) 55%,transparent);color:var(--bad)}
.btn.sm{min-height:30px;padding:5px 10px;font-size:11.5px}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border:1px solid var(--line);font:600 10.5px/1.5 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);white-space:nowrap;background:var(--inset)}
.chip .ic{width:12px;height:12px}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.chip.glow{color:var(--glow);border-color:var(--line2)}
.chip.boss{color:#c9b4ff;border-color:rgba(143,107,255,.55);background:rgba(143,107,255,.12)}
:root[data-skin="sk_dream"] .chip.boss{color:#6b46e0}
.bar{height:6px;background:color-mix(in srgb,var(--text) 8%,transparent);position:relative;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--accent2),var(--glow));box-shadow:0 0 10px var(--glow-b)}
.bar.thin{height:4px}
.bar.wc>i{background:var(--wc,var(--glow));box-shadow:0 0 10px color-mix(in srgb,var(--wc,var(--glow)) 50%,transparent)}
input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{width:100%;background:var(--inset);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:0;min-height:38px}
textarea{min-height:92px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--glow);outline:none;box-shadow:0 0 0 3px var(--glow-a)}
label.fld{display:flex;flex-direction:column;gap:5px;font:600 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:6px 0}
.check input{appearance:none;flex:none;width:20px;height:20px;border:1px solid var(--line2);background:var(--inset);display:grid;place-items:center;margin-top:1px;cursor:pointer}
.check input:checked{background:var(--ok);border-color:var(--ok)}
.check input:checked::after{content:"";width:10px;height:6px;border-left:2px solid #042014;border-bottom:2px solid #042014;transform:rotate(-45deg) translate(1px,-1px)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:9px 12px;color:var(--dim);font:600 12px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-color:var(--glow)}
.seg{display:inline-flex;border:1px solid var(--line);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;color:var(--dim);font:600 11.5px/1 var(--f-mono);letter-spacing:.05em;cursor:pointer}
.seg button.on{background:var(--glow-a);color:var(--text)}
.empty{padding:22px;text-align:center;color:var(--dim);border:1px dashed var(--line)}

/* ---------- status ---------- */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.avatar{--fs:92px;width:var(--fs);height:var(--fs);position:relative;display:grid;place-items:center;flex:none}
.avatar .in{width:100%;height:100%;display:grid;place-items:center;overflow:hidden;background:var(--inset);font:700 34px/1 var(--f-display);color:var(--glow);clip-path:polygon(25% 3%,75% 3%,98% 50%,75% 97%,25% 97%,2% 50%)}
.avatar .in img{width:100%;height:100%;object-fit:cover}
.avatar .fr{position:absolute;inset:-5px;clip-path:polygon(25% 3%,75% 3%,98% 50%,75% 97%,25% 97%,2% 50%);z-index:-1}
.fr-basic{background:var(--line2)}
.fr-rare{background:linear-gradient(135deg,#4fa3ff,#9fd2ff,#4fa3ff);box-shadow:0 0 18px #4fa3ff}
.fr-epic{background:conic-gradient(from 0deg,#b77bff,#5b3bd6,#b77bff,#ff7ad9,#b77bff)}
.fr-legend{background:conic-gradient(from 0deg,#f2c14e,#fff1b8,#b8860b,#f2c14e);animation:spin 6s linear infinite}
.fr-mythic{background:conic-gradient(from 0deg,#ff5470,#f2c14e,#3ee6a8,#4fb3ff,#b77bff,#ff5470);animation:spin 4s linear infinite}
.fr-glitch{background:repeating-linear-gradient(90deg,#00fff0 0 6px,#ff00aa 6px 12px)}
@keyframes spin{to{filter:hue-rotate(360deg)}}
.pname{font:700 26px/1.05 var(--f-display);letter-spacing:.03em}
.ptitle{font:600 12.5px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.fx-cyan{background:linear-gradient(90deg,#6ff7ff,#4fb3ff,#b28bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.fx-gold{background:linear-gradient(90deg,#fff1b8,#f2c14e,#b8860b);-webkit-background-clip:text;background-clip:text;color:transparent}
.fx-glitch{text-shadow:2px 0 #ff00aa,-2px 0 #00fff0;animation:glitch 2.4s infinite steps(1)}
@keyframes glitch{0%,92%{transform:none}93%{transform:translateX(2px)}95%{transform:translateX(-2px)}97%{transform:none}}
.rank{display:grid;place-items:center;width:64px;height:64px;border:1px solid var(--line2);font:700 30px/1 var(--f-display);color:var(--glow);text-shadow:0 0 16px var(--glow-b);background:var(--inset)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px}
.stat{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.stat b{font:700 13px/1 var(--f-mono);color:var(--wc)}
.stat span{color:var(--dim);font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat em{font:600 15px/1 var(--f-mono);font-style:normal}
.radar{max-width:100%;height:auto;display:block;margin:0 auto}
.radar .rd-k{font:700 12px var(--f-mono)}.radar .rd-v{font:500 11px var(--f-mono);fill:var(--dim)}
.daily{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);background:var(--inset);cursor:pointer;user-select:none}
.daily:hover{border-color:var(--line2)}
.daily .box{width:26px;height:26px;border:1px solid var(--line2);display:grid;place-items:center;color:transparent}
.daily.on .box{background:var(--ok);border-color:var(--ok);color:#03140d}
.daily.on .t{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--faint)}
.daily .t{font-weight:600}.daily .d{font-size:13px;color:var(--faint)}
.daily .rw{font:600 11.5px/1.2 var(--f-mono);color:var(--dim);text-align:right}
.streak{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);background:linear-gradient(90deg,rgba(255,122,89,.12),transparent)}
.streak b{font:700 26px/1 var(--f-display);color:#ff9a6b}
.notif{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.notif:last-child{border-bottom:0}
.emerg{border-color:color-mix(in srgb,var(--bad) 60%,transparent);background:linear-gradient(90deg,rgba(255,84,112,.16),transparent)}
.emerg::before,.emerg::after{border-color:var(--bad)}

/* ---------- ways & quests ---------- */

.pzfig .f-scan{opacity:0;animation:pzScan 4.6s linear infinite}
.pzfig.m-miss .f-float{animation:pzFloat 5.5s ease-in-out infinite,pzJit 3.4s steps(1) infinite}
@keyframes pzFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pzSpin{to{transform:rotate(360deg)}}
@keyframes pzFlick{0%,45%,48%,79%,83%,100%{opacity:1}46%,47%{opacity:.22}80%,82%{opacity:.4}}
@keyframes pzDrip{0%{transform:translateY(-8px);opacity:0}18%{opacity:1}100%{transform:translateY(28px);opacity:0}}
@keyframes pzScan{0%{transform:translateY(0);opacity:0}8%,92%{opacity:.32}100%{transform:translateY(350px);opacity:0}}
@keyframes pzJit{0%,90%,97%,100%{translate:0 0}91%,92%{translate:-3px 0}94%,95%{translate:3px 1px}}
@keyframes pzIn{from{opacity:0}to{opacity:1}}
@keyframes pzRise{0%{opacity:0;transform:translateY(14px) scaleY(.6);filter:brightness(2.2)}60%{opacity:1;transform:translateY(0) scaleY(1.02)}100%{transform:none;filter:none}}
@keyframes pzPulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--pzc) 22%,transparent)}}
@keyframes pzHit{50%{transform:scale(1.04);filter:brightness(1.5)}}

.pzov{position:fixed;inset:0;z-index:80;overflow:auto;display:grid;place-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));
  --pzc:#4fb3ff;--pzbg:rgba(1,3,8,.975);--text:#dce9ff;--dim:#93a7c9;--faint:#647a9e;--line:rgba(130,175,255,.2);--line2:rgba(140,190,255,.45);--inset:rgba(3,8,18,.62);--bg1:#07101f;--glow-a:rgba(79,179,255,.12);
  color:var(--text);color-scheme:dark;background:radial-gradient(820px 620px at 28% 46%,color-mix(in srgb,var(--pzc) 15%,transparent),transparent 68%),var(--pzbg);animation:pzIn .45s ease both}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  :root:not([data-motion="off"]) .pzov{--pzbg:rgba(1,3,8,.94);-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px)}
}
.pzov.still,.pzov.still .pzfigw,.pzov.still .pzpan{animation:none}
.pzov::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}
.pzov.k-miss{--pzc:#ff5470}.pzov.k-ok{--pzc:#3ee6a8}.pzov.k-intro{--pzc:#a98bff}.pzov.k-late{--pzc:#f2c14e}
.pzbox{position:relative;display:grid;grid-template-columns:minmax(200px,320px) minmax(0,580px);gap:34px;align-items:center;width:100%;max-width:980px}
.pzfigw{display:grid;place-items:center;animation:pzRise .7s cubic-bezier(.2,.8,.2,1) both}
.pzpan{position:relative;display:flex;flex-direction:column;gap:14px;padding:22px;border:1px solid color-mix(in srgb,var(--pzc) 45%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--pzc) 9%,transparent),rgba(4,9,19,.88));box-shadow:0 20px 70px rgba(0,0,0,.5),0 0 40px color-mix(in srgb,var(--pzc) 12%,transparent);animation:pzRise .7s .12s cubic-bezier(.2,.8,.2,1) both;min-width:0}
.pzpan::before,.pzpan::after{content:"";position:absolute;width:16px;height:16px;pointer-events:none;border-color:var(--pzc)}
.pzpan::before{top:-1px;left:-1px;border-top:2px solid;border-left:2px solid}.pzpan::after{bottom:-1px;right:-1px;border-bottom:2px solid;border-right:2px solid}
.pztag{display:flex;align-items:center;gap:8px;font:700 11.5px/1.2 var(--f-mono);letter-spacing:.22em;text-transform:uppercase;color:var(--pzc)}
.pztag::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--pzc),transparent);opacity:.5}
.pzline{font:600 clamp(20px,2.5vw,28px)/1.28 var(--f-display);letter-spacing:.01em;min-height:2.56em;text-wrap:balance;margin:0}
.pzline .cur{display:inline-block;width:.5em;height:.95em;background:var(--pzc);vertical-align:-.1em;margin-left:3px;animation:blink 1s steps(1) infinite}
.pzsub{color:var(--dim);font-size:14.5px;line-height:1.5}
.pzsub b{color:var(--text)}
.pzclock{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.pzclock b{font:700 clamp(46px,7.4vw,74px)/.95 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--pzc);text-shadow:0 0 26px color-mix(in srgb,var(--pzc) 45%,transparent)}
.pzclock span{font:600 11.5px/1.35 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.pzbar{height:5px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
.pzbar>i{position:absolute;inset:0 auto 0 0;background:var(--pzc);box-shadow:0 0 10px var(--pzc);transition:width 1s linear}
.pzfacts{display:flex;gap:6px;flex-wrap:wrap}
.pzov .chip{border-color:color-mix(in srgb,var(--pzc) 32%,transparent);white-space:normal}
.pzacts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pzov .btn{border-color:color-mix(in srgb,var(--pzc) 50%,transparent);color:var(--text)}
.pzov .btn:hover{background:color-mix(in srgb,var(--pzc) 14%,transparent);border-color:var(--pzc)}
.pzov .btn.primary{background:var(--pzc);border-color:var(--pzc);color:#03101e;box-shadow:0 0 22px color-mix(in srgb,var(--pzc) 35%,transparent)}
.pzov .btn.ghost{border-color:transparent;color:var(--dim)}
.pzov .q{color:var(--text)}
.pzlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:14.5px;color:var(--dim)}
.pzlist li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px}.pzlist li::before{content:"";width:6px;height:6px;margin-top:8px;background:var(--pzc);box-shadow:0 0 6px var(--pzc)}
.pzlist b{color:var(--text)}
.pzwheel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.pzwheel span{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);background:var(--inset);font:600 12px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.pzwheel span.on{color:#03101e;background:var(--pzc);border-color:var(--pzc);box-shadow:0 0 18px var(--pzc)}
.pzwheel span.hit{animation:pzHit .45s ease 3}
.pzsent{border:1px solid color-mix(in srgb,var(--pzc) 45%,transparent);border-left:3px solid var(--pzc);background:rgba(3,8,18,.6);padding:14px;display:flex;flex-direction:column;gap:8px}
.pzsent h3{font-size:19px;letter-spacing:.04em}
.pzsys{position:absolute;right:-6px;bottom:-34px;opacity:.9}

.pzpill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--pzc);background:color-mix(in srgb,var(--pzc) 12%,var(--inset));color:var(--pzc);font:700 12px/1.2 var(--f-mono);white-space:nowrap;text-decoration:none;cursor:pointer}
.pzpill .ic{width:14px;height:14px}
.pzpill.p-janela{--pzc:var(--bad);animation:pzPulse 1.6s ease-in-out infinite}
.pzpill.p-done{--pzc:var(--ok)}.pzpill.p-limbo{--pzc:var(--warn)}.pzpill.p-zona{--pzc:var(--bad)}.pzpill.p-pre{--pzc:var(--dim)}.pzpill.p-selo{--pzc:var(--accent2)}

.pztl{position:relative;height:60px;margin:14px 0 4px}
.pztl .tl-rail{position:absolute;left:0;right:0;top:25px;height:8px;background:color-mix(in srgb,var(--text) 9%,transparent)}
.pztl .tl-seg{position:absolute;top:25px;height:8px}
.pztl .tl-seg.w{background:var(--glow);box-shadow:0 0 10px var(--glow-b)}.pztl .tl-seg.l{background:color-mix(in srgb,var(--warn) 55%,transparent)}
.pztl .mk{position:absolute;top:17px;width:1px;height:24px;background:var(--line2)}
.pztl .mk span{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font:600 10.5px/1 var(--f-mono);color:var(--dim);white-space:nowrap}
.pztl .mk span i{font-style:normal}
.pztl .mk.b span{top:auto;bottom:-15px}
.pztl .now{position:absolute;top:18px;width:3px;height:22px;margin-left:-1px;background:var(--text);box-shadow:0 0 8px var(--text)}
.pzdays{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px}
.pzd{aspect-ratio:1;display:grid;place-items:center;border:1px solid var(--line);font:600 10px/1 var(--f-mono);color:var(--faint);background:var(--inset);min-width:0}
.pzd.ok{background:var(--hm-done);border-color:var(--hm-done);color:#fff}.pzd.miss{background:var(--bad);border-color:var(--bad);color:#fff}
.pzd.rest{background:var(--hm-rest);border-color:var(--hm-rest);color:#fff}.pzd.late{background:var(--hm-extra);border-color:var(--hm-extra);color:#fff}
.pzd.today{box-shadow:0 0 0 2px var(--bg0),0 0 0 3px var(--glow)}
.pzcard{border:1px solid color-mix(in srgb,var(--bad) 42%,transparent);border-left:3px solid var(--bad);background:linear-gradient(90deg,rgba(255,84,112,.07),var(--inset) 55%);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pzcard.paid{border-color:color-mix(in srgb,var(--ok) 42%,transparent);border-left-color:var(--ok);background:var(--inset)}
.pzcard h3{font-size:17px}
.pzcard textarea{min-height:120px}
.pzex{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.pzex b{font:700 13px/1 var(--f-mono);color:var(--glow);white-space:nowrap}
.pzseal{border:1px solid var(--accent2);background:linear-gradient(90deg,rgba(143,107,255,.14),transparent);padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.pzcode{width:100%;min-height:220px;font:12px/1.45 var(--f-mono);white-space:pre;overflow:auto}
.pzcmd{font:600 13px/1.5 var(--f-mono);padding:2px 7px;border:1px solid var(--line2);background:var(--inset);color:var(--glow);white-space:nowrap;user-select:all;-webkit-user-select:all}
input[type=time]{width:100%;background:var(--inset);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:0;min-height:38px;font:inherit}
input[type=time]:focus{border-color:var(--glow);outline:none;box-shadow:0 0 0 3px var(--glow-a)}
.daychips{display:flex;gap:5px;flex-wrap:wrap}
.daychips button{min-width:44px;padding:7px 8px;border:1px solid var(--line);background:var(--inset);color:var(--dim);font:600 11.5px/1 var(--f-mono);cursor:pointer}
.daychips button.on{color:var(--text);border-color:var(--glow);background:var(--glow-a)}
@media (max-width:820px){
  .pzov{place-items:start center}
  .pzbox{grid-template-columns:1fr;gap:4px;justify-items:center}
  .pzfigw svg{width:118px}
  .pzpan{padding:16px;width:100%;gap:12px}
  .pzline{min-height:0}
  .pzlist{font-size:14px;gap:6px}
  .pzsys{display:none}
  .pzdays{grid-template-columns:repeat(7,minmax(0,1fr))}
  .pztl .mk span i{display:none}
  /* a ação principal fica sempre ao alcance do polegar, mesmo com texto longo */
  .pzacts{position:sticky;bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:2;margin:0 -8px;padding:12px 8px 8px;background:linear-gradient(180deg,transparent,rgba(4,9,19,.97) 34%)}
  .pzacts .btn{flex:1 1 auto;justify-content:center}
}
@media (max-height:640px) and (min-width:821px){
  .pzov{place-items:start center}
  .pzfigw svg{width:220px}
}

/* trava curta de edição enquanto o save da nuvem é conferido (abertura e volta do sono) */
body.sy-hold{cursor:progress}
body.sy-hold .view,body.sy-hold .drawer,body.sy-hold .modal,body.sy-hold .more-sheet{pointer-events:none}
.syhold{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:95;width:min(580px,calc(100vw - 24px));display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--warn);background:var(--bg1);color:var(--text);font-size:13.5px;line-height:1.45;box-shadow:0 14px 44px rgba(0,0,0,.6);cursor:default}
.syhold b{color:var(--warn)}
.syhold .btn{flex:none}
@media (max-width:560px){.syhold{flex-direction:column;align-items:stretch}}
/* ===== Cidade (beta): radar, mapa, insígnias de rank, corrupção ===== */
:root{--cy-red:#ff3b5c}
/* ===== Cidade · palco sem rolagem e mapa de bairros ===== */
html.cy-full,html.cy-full body{overflow:hidden;overscroll-behavior:none}
html.cy-full .view{max-width:none;padding:0;gap:0;overflow:hidden}
.cy-stage{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 46%,color-mix(in srgb,var(--glow) 7%,var(--bg0)) 0%,var(--bg0) 72%)}
.cy-mapbox{position:absolute;inset:0}
.cy-svg{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.cy-bgr{fill:transparent}
.cy-zs,.cy-tint,.cy-noise,.cy-crack,.cy-edge,.cy-av,.cy-avc,.cy-cal,.cy-rio,.cy-rio2,.cy-ponte,.cy-fog,.cy-frame,.cy-drift,.cy-plaza,.cy-ring,.cy-spin,.cy-gate,.cy-lb{pointer-events:none}
.cy-dz{fill:var(--wc);fill-opacity:.07;cursor:pointer;outline:none;transition:fill-opacity .2s}
.cy-d:hover .cy-dz,.cy-dz:focus-visible{fill-opacity:.15}
.cy-sel .cy-dz{fill-opacity:.22}
.cy-centro .cy-dz{fill-opacity:.035}
.cy-st2{fill:none;stroke:var(--wc);stroke-opacity:.13;stroke-width:1}
.cy-bld{fill:var(--wc);fill-opacity:.1;stroke:var(--wc);stroke-opacity:.24;stroke-width:.7}
.cy-st{fill:none;stroke:var(--wc);stroke-opacity:.36;stroke-width:4.5;stroke-linecap:round}
.cy-edge{fill:none;stroke:var(--wc);stroke-width:5;stroke-opacity:.5}
.cy-sel .cy-edge{stroke-width:10;stroke-opacity:1}
.cy-d:focus-within .cy-edge{stroke-width:10;stroke-dasharray:10 7;stroke-opacity:1}
.cy-av{fill:none;stroke:var(--bg1);stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
.cy-avc{fill:none;stroke:var(--line2);stroke-width:1.2;stroke-dasharray:7 9;opacity:.75}
.cy-cal{fill:none;stroke:var(--line2);stroke-width:2;opacity:.75}
.cy-rio{fill:none;stroke:color-mix(in srgb,var(--glow) 26%,var(--bg1));stroke-width:30;stroke-linecap:round}
.cy-rio2{fill:none;stroke:color-mix(in srgb,var(--glow) 65%,transparent);stroke-width:1.4;stroke-dasharray:14 22;opacity:.6;animation:cy-flow 6s linear infinite}
@keyframes cy-flow{to{stroke-dashoffset:-72}}
.cy-ponte{fill:var(--bg2);stroke:var(--line2);stroke-width:1.2}
.cy-fog{fill:var(--bg0);opacity:.93}
.cy-frame{fill:none;stroke:var(--glow);stroke-width:1.6;stroke-opacity:.45;stroke-dasharray:2 5}
.cy-mist{fill:var(--dim);opacity:.13}
.cy-drift{animation:cy-drift 18s ease-in-out infinite alternate}
@keyframes cy-drift{to{transform:translate(-14px,9px)}}
.cy-plaza{fill:var(--glow);fill-opacity:.06;stroke:var(--line2);stroke-width:1.2}
.cy-ring{fill:none;stroke:var(--glow);stroke-width:2}
.cy-ring2{fill:none;stroke:var(--glow);stroke-width:1.2;stroke-dasharray:3 7;opacity:.7}
.cy-spin{animation:cy-spin 40s linear infinite}
@keyframes cy-spin{to{transform:rotate(360deg)}}
.cy-gate{fill:var(--glow);fill-opacity:.22;stroke:var(--glow);stroke-width:1.2;animation:cy-gate 3.6s ease-in-out infinite}
@keyframes cy-gate{50%{fill-opacity:.42}}
.cy-nev{cursor:pointer;outline:none}
.cy-nevz{fill:var(--dim);opacity:.3;transition:opacity .2s}
.cy-nevh{fill:transparent;stroke:var(--faint);stroke-width:1.2;stroke-dasharray:4 6;opacity:.55}
.cy-nev:hover .cy-nevz,.cy-nev:focus-visible .cy-nevz,.cy-nev.cy-sel .cy-nevz{opacity:.55}
.cy-fogt{font:700 22px/1 var(--f-display);fill:var(--faint);letter-spacing:.3em;text-anchor:middle;pointer-events:none}
.cy-icb{fill:var(--bg1);stroke:var(--wc);stroke-width:1.6}
.cy-ic path{fill:none;stroke:var(--wc);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.cy-name{font-family:var(--f-display);font-weight:700;fill:var(--text);text-anchor:middle;letter-spacing:.01em;paint-order:stroke;stroke:var(--bg0);stroke-width:4px;stroke-linejoin:round}
.cy-sub{font:500 11.5px/1 var(--f-mono);fill:var(--dim);text-anchor:middle;letter-spacing:.04em;paint-order:stroke;stroke:var(--bg0);stroke-width:3px}
.cy-redt{fill:var(--cy-red)}
.cy-lbr .cy-icb,.cy-lbr .cy-ic path{stroke:var(--cy-red)}
.cy-cnt circle{fill:var(--wc);stroke:var(--bg0);stroke-width:2}
.cy-cnt text{font:700 11px/1 var(--f-mono);fill:var(--bg0);text-anchor:middle}
.cy-port .cy-cnt text{font-size:13px}
.cy-corr .cy-edge{stroke:var(--cy-red)}
.cy-corr .cy-st{stroke:var(--cy-red);stroke-opacity:.3}
.cy-tint{fill:var(--cy-red)}
.cy-c1 .cy-tint{fill-opacity:.08}.cy-c2 .cy-tint{fill-opacity:.15}.cy-c3 .cy-tint{fill-opacity:.22}
.cy-noise{animation:cy-jit .9s steps(3) infinite}
.cy-c1 .cy-noise{opacity:.32}.cy-c2 .cy-noise{opacity:.5}.cy-c3 .cy-noise{opacity:.7}
@keyframes cy-jit{0%{transform:translate(0,0)}33%{transform:translate(-4px,3px)}66%{transform:translate(3px,-2px)}100%{transform:translate(0,0)}}
.cy-crack{fill:none;stroke:var(--cy-red);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cy-c3 .cy-edge{animation:cy-flick 2.6s steps(1) infinite}
@keyframes cy-flick{0%,100%{stroke-opacity:1}48%{stroke-opacity:.35}52%{stroke-opacity:1}70%{stroke-opacity:.6}}
.cy-badge-b{fill:var(--bg0);stroke:var(--rc);stroke-width:2}
.cy-badge-o{fill:none;stroke:var(--rc);stroke-width:1.2;opacity:.55}
.cy-badge-t{font-family:var(--f-display);font-weight:700;fill:var(--rc)}
.cy-rS .cy-badge-o{animation:cy-pulse 1.8s ease-in-out infinite}
@keyframes cy-pulse{50%{opacity:.1}}
.cy-rk{display:inline-block;vertical-align:middle;overflow:visible}
.cy-svg .cy-badge{filter:drop-shadow(0 2px 5px rgba(0,0,0,.55))}
.cy-badge[data-a]{cursor:pointer;outline:none}
.cy-badge[data-a]:hover .cy-badge-b,.cy-badge[data-a]:focus-visible .cy-badge-b{stroke-width:3.6}
/* HUD da Cidade: você no canto, o minimapa no outro, a Estação embaixo */
.cy-hud{position:absolute;inset:0;pointer-events:none}
.cy-hud>*{pointer-events:auto}
.cy-me{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:10px;padding:5px 16px 5px 5px;border:1px solid var(--line2);background:color-mix(in srgb,var(--bg1) 80%,transparent);backdrop-filter:blur(8px);color:var(--text);font:inherit;text-align:left;cursor:pointer;border-radius:40px 8px 8px 40px;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:border-color .15s,box-shadow .15s}
.cy-me:hover,.cy-me:focus-visible{border-color:var(--glow);box-shadow:0 0 0 1px var(--glow),0 8px 28px var(--glow-a);outline:none}
.cy-me-av{position:relative;flex:none;width:50px;height:50px}
.cy-me-av img,.cy-me-av .cy-noimg{width:50px;height:50px;border-radius:50%;object-fit:cover;border:2px solid var(--glow);background:#000;display:grid;place-items:center}

.cy-me-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.cy-me-t b{font:700 14px/1.1 var(--f-display);letter-spacing:.04em;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cy-me-t span{font:500 11px/1.2 var(--f-mono);color:var(--dim);letter-spacing:.04em;white-space:nowrap}
.cy-mini{position:absolute;top:10px;right:10px;width:136px;height:136px;padding:0;border:0;background:none;cursor:pointer;border-radius:50%;color:var(--text)}
.cy-mini:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
.cy-mini-svg{display:block;width:100%;height:100%;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
.cy-mini-t{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);padding:2px 9px;border:1px solid var(--line2);background:var(--bg1);font:700 11px/1.3 var(--f-mono);letter-spacing:.08em;border-radius:10px;white-space:nowrap}

/* ===== Cidade · janelas com vinheta ===== */
.cyw{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:16px}

.cyw-win{position:relative;grid-area:1/1;width:min(600px,100%);max-height:min(86vh,780px);display:flex;flex-direction:column;background:var(--bg1);border:1px solid color-mix(in srgb,var(--wc) 45%,var(--line2));box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 46px color-mix(in srgb,var(--wc) 16%,transparent);animation:cyw-in .32s cubic-bezier(.2,.8,.2,1)}

.cyw-ic{display:grid;place-items:center;width:40px;height:40px;flex:none;border:1px solid color-mix(in srgb,var(--wc) 60%,transparent);color:var(--wc);background:var(--inset);border-radius:50%}

.cyw-x,.cyw-bk{align-self:flex-start}
.cy-ph .cy-ph-rk{flex:none;line-height:0}
.cyw-b{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain;min-height:0}

.cy-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

@media (max-width:560px){

.cyt{position:fixed;inset:0;z-index:57;display:none;cursor:pointer}
.cyt.on{display:block}
.cyt-dim{position:absolute;inset:0;background:radial-gradient(ellipse at 60% 40%,rgba(2,5,12,.25) 0%,rgba(2,5,12,.72) 65%,rgba(2,5,12,.9) 100%);animation:cyw-fade .3s ease-out}
